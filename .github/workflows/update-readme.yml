name: Update README version list

on:
  push:
    branches: [main]
    paths:
      - 'Casks/**'
      - 'scripts/update_readme.py'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate the version list in README.md
        run: python3 scripts/update_readme.py

      - name: Commit, push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already up to date."
            exit 0
          fi

          BRANCH="readme-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "docs(readme): refresh version list from Casks/"

          # Pass the expected remote SHA explicitly (single-branch checkout, see autoupdate.yml).
          REMOTE_SHA=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" -u origin "$BRANCH"

          # Open the PR only once; re-runs just update the branch
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs(readme): refresh version list from Casks/" \
              --body "Regenerated by the update-readme workflow from the casks in Casks/."
          fi

          gh pr merge "$BRANCH" --auto --squash

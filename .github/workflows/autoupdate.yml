name: Update Autenticação.gov Cask

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at midnight
  workflow_dispatch:

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch latest release assets and parse version/build
        id: latest_release
        run: |
          # 1. Get information about the latest release
          RELEASE_JSON=$(curl -s https://api.github.com/repos/amagovpt/autenticacao.gov/releases/latest)
          
          # Check whether the tag is a pre-release
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          if echo "$TAG_NAME" | grep -iE 'beta|rc|alpha|dev|preview'; then
            echo "Test release detected ($TAG_NAME). Ignoring."
            echo "UPDATED=false" >> $GITHUB_ENV
            exit 0
          fi

          # 2. Find the .pkg file URL in the release assets
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Autenticacao.gov_MacOS_.*-Signed\\.pkg$")) | .browser_download_url' | head -n 1)
          FILE_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Autenticacao.gov_MacOS_.*-Signed\\.pkg$")) | .name' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Could not find the .pkg file in the assets."
            exit 1
          fi

          # 3. Extract the main version and build number using a regex
          # Example FILE_NAME: Autenticacao.gov_MacOS_3.15.0.6058-Signed.pkg
          FULL_VER=$(echo "$FILE_NAME" | sed -E 's/Autenticacao.gov_MacOS_(.*)-Signed\.pkg/\1/')
          MAIN_VER=$(echo "$FULL_VER" | cut -d'.' -f1-3) # 3.15.0
          BUILD_NUM=$(echo "$FULL_VER" | cut -d'.' -f4)   # 6058

          NEW_VERSION_STR="${MAIN_VER},${BUILD_NUM}"

          # 4. Guardrail: the cask builds its URL as
          #    releases/download/<tag>/Autenticacao.gov_MacOS_<ver>.<build>-Signed.pkg
          # Upstream has shipped tags that disagree with the pkg version (tag v3.16.0,
          # pkg 3.16.1.6201). The tag comes from the release, so the URL stays correct
          # for that case. If the asset is named differently, stop instead of writing
          # a cask that points at nothing.
          EXPECTED_URL="https://github.com/amagovpt/autenticacao.gov/releases/download/${TAG_NAME}/Autenticacao.gov_MacOS_${FULL_VER}-Signed.pkg"
          if [ "$EXPECTED_URL" != "$DOWNLOAD_URL" ]; then
            echo "::error title=Asset URL not supported::Cask template would produce $EXPECTED_URL but the release asset is $DOWNLOAD_URL. Update the cask template before this can be automated."
            exit 1
          fi

          TAG_VER=${TAG_NAME#v}
          if [ "$TAG_VER" != "$FULL_VER" ]; then
            echo "::warning title=Release tag/package version mismatch::Tag $TAG_NAME but package is $FILE_NAME. Verify the release on upstream."
          fi

          echo "NEW_VERSION_STR=$NEW_VERSION_STR" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Check if Cask needs updating
        id: check
        run: |
          CURRENT_VERSION=$(grep 'version "' Casks/autenticacao-gov.rb | cut -d '"' -f 2)
          # Tag segment of the cask URL, e.g. "v3.16.0" or the unresolved "v#{version.csv.first}"
          CURRENT_TAG=$(grep -oP 'releases/download/\K[^/]+' Casks/autenticacao-gov.rb | head -n 1)
          echo "Current version in the Cask: $CURRENT_VERSION (tag: $CURRENT_TAG)"
          echo "Detected version: $NEW_VERSION_STR (tag: $TAG_NAME)"

          # A new version needs a new cask. A stale URL on the same version (tag changed
          # upstream) also needs a rewrite, but must not archive the cask as a pinned version.
          VERSION_CHANGED=false
          if [ "$CURRENT_VERSION" != "$NEW_VERSION_STR" ] && [ -n "$NEW_VERSION_STR" ]; then
            VERSION_CHANGED=true
          fi
          if [ "$VERSION_CHANGED" = true ] || [ "$CURRENT_TAG" != "$TAG_NAME" ]; then
            echo "UPDATED=true" >> $GITHUB_ENV
          else
            echo "UPDATED=false" >> $GITHUB_ENV
          fi
          echo "VERSION_CHANGED=$VERSION_CHANGED" >> $GITHUB_ENV

      - name: Archive current Cask as a pinned version
        if: env.UPDATED == 'true' && env.VERSION_CHANGED == 'true'
        run: |
          # Copy the Cask being replaced to its own @version file, before it is overwritten
          OLD_MAIN=$(grep 'version "' Casks/autenticacao-gov.rb | cut -d '"' -f 2 | cut -d',' -f1)
          sed -e "s/^cask \"autenticacao-gov\" do/cask \"autenticacao-gov@${OLD_MAIN}\" do/" \
              -e '/^  pkg /i\  conflicts_with cask: "autenticacao-gov"' \
              Casks/autenticacao-gov.rb > "Casks/autenticacao-gov@${OLD_MAIN}.rb"

          # Keep only the 5 newest pinned versions
          ls Casks/autenticacao-gov@*.rb | sort -V | head -n -5 | xargs -r rm -f

      - name: Calculate SHA256 and update Cask
        if: env.UPDATED == 'true'
        run: |
          echo "Downloading $DOWNLOAD_URL to calculate the SHA256..."
          # -f: fail on HTTP errors instead of hashing the error page
          if ! curl -fsSL -o release.pkg "$DOWNLOAD_URL"; then
            echo "::error title=Download failed::$DOWNLOAD_URL did not return a file. Cask not updated."
            exit 1
          fi

          # A .pkg is a xar archive: reject anything else (HTML error page, truncated file)
          if [ "$(head -c 4 release.pkg)" != "xar!" ]; then
            echo "::error title=Not a pkg::$DOWNLOAD_URL is not a xar/pkg file. Cask not updated."
            exit 1
          fi
          if [ "$(stat -c %s release.pkg)" -lt 1000000 ]; then
            echo "::error title=Pkg too small::$DOWNLOAD_URL is suspiciously small. Cask not updated."
            exit 1
          fi

          SHA256=$(sha256sum release.pkg | awk '{print $1}')

          # Update the values in the .rb Cask. The tag comes from the release, the rest
          # of the URL keeps the cask's version interpolation.
          sed -i "s/version \".*\"/version \"${NEW_VERSION_STR}\"/" Casks/autenticacao-gov.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/autenticacao-gov.rb
          sed -i "s|^  url \".*\"|  url \"https://github.com/amagovpt/autenticacao.gov/releases/download/${TAG_NAME}/Autenticacao.gov_MacOS_#{version.csv.first}.#{version.csv.second}-Signed.pkg\"|" Casks/autenticacao-gov.rb

      - name: Commit, push branch and open PR
        if: env.UPDATED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="cask-update-${NEW_VERSION_STR//,/.}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Casks/
          git commit -m "chore(cask): update autenticacao-gov to ${NEW_VERSION_STR}"
          # Pass the expected remote SHA explicitly: the checkout is single-branch, so
          # git has no remote-tracking ref for an existing branch and a bare
          # --force-with-lease is rejected as "stale info" on re-runs.
          REMOTE_SHA=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" -u origin "$BRANCH"

          # Open the PR only once; re-runs just update the branch
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(cask): update autenticacao-gov to ${NEW_VERSION_STR}" \
              --body "Automated update from the upstream release. Merges automatically once approved."
          fi

          # Merge when the required review is in
          gh pr merge "$BRANCH" --auto --squash
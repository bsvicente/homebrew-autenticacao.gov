name: Update Autenticação.gov Cask

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at midnight
  workflow_dispatch:

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest release assets and parse version/build
        id: latest_release
        run: |
          # 1. Get information about the latest release
          RELEASE_JSON=$(curl -s https://api.github.com/repos/amagovpt/autenticacao.gov/releases/latest)
          
          # Check whether the tag is a pre-release
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          if echo "$TAG_NAME" | grep -iE 'beta|rc|alpha|dev|preview'; then
            echo "Test release detected ($TAG_NAME). Ignoring."
            echo "UPDATED=false" >> $GITHUB_ENV
            exit 0
          fi

          # 2. Find the .pkg file URL in the release assets
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Autenticacao.gov_MacOS_.*-Signed\\.pkg$")) | .browser_download_url' | head -n 1)
          FILE_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Autenticacao.gov_MacOS_.*-Signed\\.pkg$")) | .name' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Could not find the .pkg file in the assets."
            exit 1
          fi

          # 3. Extract the main version and build number using a regex
          # Example FILE_NAME: Autenticacao.gov_MacOS_3.15.0.6058-Signed.pkg
          FULL_VER=$(echo "$FILE_NAME" | sed -E 's/Autenticacao.gov_MacOS_(.*)-Signed\.pkg/\1/')
          MAIN_VER=$(echo "$FULL_VER" | cut -d'.' -f1-3) # 3.15.0
          BUILD_NUM=$(echo "$FULL_VER" | cut -d'.' -f4)   # 6058

          NEW_VERSION_STR="${MAIN_VER},${BUILD_NUM}"

          echo "NEW_VERSION_STR=$NEW_VERSION_STR" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Check if Cask needs updating
        id: check
        run: |
          CURRENT_VERSION=$(grep 'version "' Casks/autenticacao-gov.rb | cut -d '"' -f 2)
          echo "Current version in the Cask: $CURRENT_VERSION"
          echo "Detected version: $NEW_VERSION_STR"
          
          if [ "$CURRENT_VERSION" != "$NEW_VERSION_STR" ] && [ -n "$NEW_VERSION_STR" ]; then
            echo "UPDATED=true" >> $GITHUB_ENV
          else
            echo "UPDATED=false" >> $GITHUB_ENV
          fi

      - name: Archive current Cask as a pinned version
        if: env.UPDATED == 'true'
        run: |
          # Copy the Cask being replaced to its own @version file, before it is overwritten
          OLD_MAIN=$(grep 'version "' Casks/autenticacao-gov.rb | cut -d '"' -f 2 | cut -d',' -f1)
          sed -e "s/^cask \"autenticacao-gov\" do/cask \"autenticacao-gov@${OLD_MAIN}\" do/" \
              -e '/^  pkg /i\  conflicts_with cask: "autenticacao-gov"' \
              Casks/autenticacao-gov.rb > "Casks/autenticacao-gov@${OLD_MAIN}.rb"

          # Keep only the 5 newest pinned versions
          ls Casks/autenticacao-gov@*.rb | sort -V | head -n -5 | xargs -r rm -f

      - name: Calculate SHA256 and update Cask
        if: env.UPDATED == 'true'
        run: |
          echo "Downloading $DOWNLOAD_URL to calculate the SHA256..."
          curl -sL -o release.pkg "$DOWNLOAD_URL"
          
          SHA256=$(sha256sum release.pkg | awk '{print $1}')
          
          # Update the values in the .rb Cask
          sed -i "s/version \".*\"/version \"${NEW_VERSION_STR}\"/" Casks/autenticacao-gov.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/autenticacao-gov.rb

      - name: Commit, push branch and open PR
        if: env.UPDATED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="cask-update-${NEW_VERSION_STR//,/.}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Casks/
          git commit -m "chore(cask): update autenticacao-gov to ${NEW_VERSION_STR}"
          git push --force-with-lease -u origin "$BRANCH"

          # Open the PR only once; re-runs just update the branch
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(cask): update autenticacao-gov to ${NEW_VERSION_STR}" \
              --body "Automated update from the upstream release. Merges automatically once approved."
          fi

          # Merge when the required review is in
          gh pr merge "$BRANCH" --auto --squash